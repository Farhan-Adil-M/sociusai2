<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session — Socius AI</title>
  <meta name="description" content="One study session: its material, flashcard decks and study tools.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/library.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body class="shell">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar" data-shell="header"></header>

  <main id="main" class="shell-main">
    <!-- Session header — rendered by js/pages/session.js (title, tags, actions) -->
    <div data-session-head class="view-head">
      <div class="loading-row"><span class="spinner" aria-hidden="true"></span><span>Loading this session…</span></div>
    </div>

    <div data-health class="stack stack-3"></div>

    <section class="panel sd-import" data-import-panel hidden aria-label="Add material to this session"></section>

    <div class="sd-columns">
      <section class="view-panel" aria-labelledby="sources-title">
        <div class="section-head">
          <h2 class="section-title" id="sources-title">Material</h2>
          <span class="row-meta" data-sources-meta></span>
        </div>
        <div class="panel" data-sources>
          <div class="loading-row"><span class="spinner" aria-hidden="true"></span><span>Loading material…</span></div>
        </div>
      </section>

      <section class="view-panel" aria-labelledby="decks-title">
        <div class="section-head">
          <h2 class="section-title" id="decks-title">Flashcard decks</h2>
        </div>
        <div class="panel" data-decks>
          <div class="loading-row"><span class="spinner" aria-hidden="true"></span><span>Loading decks…</span></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="shell-footer" data-shell="footer"></footer>
  <script type="module" src="js/pages/session.js"></script>
</body>
</html>
