<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress — Socius AI</title>
  <meta name="description" content="Your learning progress: total mastery, quiz accuracy and topic-by-topic activity across every study session.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body class="shell">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar" data-shell="header"></header>

  <main id="main" class="shell-main">
    <!-- Learning Progress — mastery + activity across all sessions -->
    <section class="app-view" id="viewProgress" aria-label="Learning Progress">
      <header class="view-head">
        <p class="view-eyebrow">LEARNING PROGRESS</p>
        <h2>Your learning progress</h2>
        <p class="view-desc">Total mastery and your activity across every study session.</p>
      </header>

      <div class="progress-stats">
        <article class="top-action-box stat-box">
          <div class="action-box-head">
            <span class="action-tag">Mastery</span>
          </div>
          <div class="action-box-title"><span id="progressMasteredFraction">—</span></div>
          <div class="action-box-value"><span id="progressMasteredPercent">—</span></div>
        </article>
        <article class="top-action-box stat-box">
          <div class="action-box-head">
            <span class="action-tag">Quiz accuracy</span>
          </div>
          <div class="action-box-title"><span id="progressAccuracy">—</span></div>
          <div class="action-box-value">average across sessions</div>
        </article>
        <article class="top-action-box stat-box">
          <div class="action-box-head">
            <span class="action-tag">Files</span>
          </div>
          <div class="action-box-title"><span id="progressFilesCount">—</span></div>
          <div class="action-box-value">uploaded study materials</div>
        </article>
      </div>

      <div class="view-panel">
        <div class="section-head">
          <div>
            <h3 class="upload-panel-heading">Topics mastered</h3>
            <p class="upload-panel-desc">Click any topic to toggle its mastered status.</p>
          </div>
          <span class="mastered-pill-badge" id="progressMasteredBadge">—</span>
        </div>
        <div class="meter"><span id="progressMasteredBar"></span></div>
        <div class="topics-checklist" id="progressTopicsList" aria-label="Topics mastery checklist"></div>
      </div>
    </section>
  </main>

  <footer class="shell-footer" data-shell="footer"></footer>
  <script type="module" src="js/pages/progress.js"></script>
</body>
</html>
