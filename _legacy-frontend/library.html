<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Library — Socius AI</title>
  <meta name="description" content="Your study sessions: organise material by subject, keep decks together, and continue where you left off.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/library.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body class="shell">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar" data-shell="header"></header>

  <main id="main" class="shell-main">
    <!-- Materials view: add material, organise it into sessions, study it -->
    <section class="app-view" id="viewMaterials" aria-label="My Materials">

      <header class="page-head view-head lib-head">
        <p class="page-eyebrow view-eyebrow">MY MATERIALS</p>
        <h1 class="page-title">Study materials &amp; PDFs</h1>
        <p class="page-sub view-desc">Add your PDFs, notes and documents here — they stay available from this page.</p>
        <div class="lib-head-actions">
          <button type="button" class="btn btn-secondary" data-import-toggle aria-expanded="false" aria-controls="import-panel">Import material</button>
          <button type="button" class="btn btn-primary" data-new-session>New session</button>
        </div>
      </header>

      <div data-health class="stack stack-3"></div>

      <!-- Import panel: library.js mounts js/components/material-import.js here
           (file input #imp-file, web-page form #imp-url/#imp-text, status
           hosts). Starts hidden; "Import material" toggles it. -->
      <section class="panel lib-import view-panel" id="import-panel" data-import-panel hidden aria-label="Import material"></section>

      <!-- Search / filter / sort -->
      <form class="lib-toolbar" role="search" data-toolbar onsubmit="return false">
        <div class="input-group lib-toolbar-search">
          <label class="sr-only" for="lib-search">Search sessions</label>
          <input class="input" id="lib-search" type="search" placeholder="Search by title, subject or tag…" autocomplete="off">
          <span class="input-group-btn" aria-hidden="true" data-search-icon></span>
        </div>
        <div class="lib-toolbar-filters">
          <label class="sr-only" for="lib-category">Filter by category</label>
          <select class="select" id="lib-category">
            <option value="">All categories</option>
            <option value="subject">Subject</option>
            <option value="research">Research</option>
            <option value="self-study">Self-study</option>
            <option value="exam-prep">Exam prep</option>
            <option value="general">General</option>
          </select>
          <label class="sr-only" for="lib-sort">Sort sessions</label>
          <select class="select" id="lib-sort">
            <option value="recent">Recently updated</option>
            <option value="active">Recently active</option>
            <option value="alpha">Title A–Z</option>
          </select>
          <label class="lib-archived">
            <input type="checkbox" id="lib-include-archived"> Show archived
          </label>
        </div>
      </form>

      <!-- Sessions -->
      <section aria-labelledby="sessions-title">
        <div class="section-head">
          <h2 class="section-title" id="sessions-title">Sessions</h2>
          <span class="row-meta" data-sessions-meta></span>
        </div>
        <div class="panel" data-sessions>
          <div class="loading-row"><span class="spinner" aria-hidden="true"></span><span>Loading your sessions…</span></div>
        </div>
      </section>

      <!-- Unsorted material -->
      <section class="lib-unsorted" aria-labelledby="unsorted-title">
        <div class="section-head">
          <h2 class="section-title" id="unsorted-title">Unsorted</h2>
          <span class="row-meta" data-unsorted-meta></span>
        </div>
        <div class="panel" data-unsorted>
          <div class="loading-row"><span class="spinner" aria-hidden="true"></span><span>Checking unsorted material…</span></div>
        </div>
      </section>
    </section>
  </main>

  <footer class="shell-footer" data-shell="footer"></footer>
  <script type="module" src="js/pages/library.js"></script>
</body>
</html>
